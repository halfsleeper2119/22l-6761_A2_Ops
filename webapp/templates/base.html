<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="{{ url_for('index') }}">VisionGuard</a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Upload</a>
        <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
        <a href="{{ url_for('health') }}">Health</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>VisionGuard &middot; 22l-6761_A2_Ops &middot; inference: {{ mode }} ({{ source }})</footer>
</body>
</html>
